<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encontre uma igreja participante do projeto Lance a Rede.">
  <title>Encontre uma Igreja | Lance a Rede</title>
  <link rel="stylesheet" href="/convite/css/buscaigreja.css">
  <script src="/convite/js/buscaigreja.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Encontre uma igreja</h1>
    <p>Escolha uma cidade ou permita sua localização para ordenar as igrejas por proximidade.</p>
    <label for="cidade">Cidade</label>
    <select id="cidade"><option value="">Todas as cidades</option></select>
    <div id="status" class="status" role="status" aria-live="polite">Carregando igrejas…</div>
    <section id="lista" aria-label="Igrejas participantes"></section>
  </main>
</body>
</html>
