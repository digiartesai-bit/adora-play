<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoraPlay - Bíblia Completa</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #1db954;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .card-grid {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Estilo Tabela Periódica / Grade de Livros */
        .livros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .livro-btn {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 5px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .livro-btn:hover, .livro-btn.ativo {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
            border-color: var(--primary-color);
        }

        .controles-leitura {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .grupo-controle {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }

        button.ler-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button.ler-btn:hover {
            opacity: 0.9;
        }

        /* Área de Leitura do Capítulo */
        .leitura-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .leitura-box h2 {
            color: var(--primary-color);
            margin-top: 0;
        }

        .versiculo-item {
            margin-bottom: 12px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .versiculo-item span {
            font-weight: bold;
            color: var(--primary-color);
            margin-right: 6px;
            font-size: 0.85rem;
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AdoraPlay Bíblia</h1>
        <p class="subtitle">Navegação Completa por Livros e Capítulos</p>

        <!-- SELETOR EM GRADE (ESTILO TABELA) -->
        <div class="card-grid">
            <h3>Escolha o Livro</h3>
            <div id="gridLivros" class="livros-grid">
                <!-- Carregado via JavaScript -->
            </div>

            <div class="controles-leitura">
                <div class="grupo-controle">
                    <label for="selectCapitulo">Capítulo:</label>
                    <select id="selectCapitulo" onchange="carregarVersiculos()">
                        <option value="">Selecione um livro acima</option>
                    </select>
                </div>
            </div>
            
            <button class="ler-btn" onclick="carregarVersiculos()">Carregar Capítulo Completo</button>
        </div>

        <div id="loader" class="loader">Carregando texto sagrado...</div>

        <!-- TEXTO DO CAPÍTULO INTEIRO -->
        <div id="leituraBox" class="leitura-box">
            <h2 id="tituloCapitulo"></h2>
            <div id="textoCapitulo"></div>
        </div>
    </div>

    <script>
        // Lista fixa de abreviações e nomes dos livros para montar a grade rápida em português
        const livrosBila = [
            {nome: "Gênesis", id: "gn"}, {nome: "Êxodo", id: "ex"}, {nome: "Levítico", id: "lv"}, {nome: "Números", id: "nm"}, {nome: "Deuteronômio", id: "dt"},
            {nome: "Josué", id: "js"}, {nome: "Juízes", id: "jz"}, {nome: "Rute", id: "rt"}, {nome: "1 Samuel", id: "1sm"}, {nome: "2 Samuel", id: "2sm"},
            {nome: "1 Reis", id: "1rs"}, {nome: "2 Reis", id: "2rs"}, {nome: "1 Crônicas", id: "1cr"}, {nome: "2 Crônicas", id: "2cr"}, {nome: "Esdras", id: "ed"},
            {nome: "Neemias", id: "ne"}, {nome: "Ester", id: "et"}, {nome: "Jó", id: "job"}, {nome: "Salmos", id: "sl"}, {nome: "Provérbios", id: "pv"},
            {nome: "Eclesiastes", id: "ec"}, {nome: "Cânticos", id: "ct"}, {nome: "Isaías", id: "is"}, {nome: "Jeremias", id: "jr"}, {nome: "Lamentações", id: "lm"},
            {nome: "Ezequiel", id: "ez"}, {nome: "Daniel", id: "dn"}, {nome: "Oséias", id: "os"}, {nome: "Joel", id: "jl"}, {nome: "Amós", id: "am"},
            {nome: "Obadias", id: "ob"}, {nome: "Jonas", id: "jn"}, {nome: "Miqueias", id: "mq"}, {nome: "Naum", id: "na"}, {nome: "Habacuque", id: "hc"},
            {nome: "Sofonias", id: "sf"}, {nome: "Ageu", id: "ag"}, {nome: "Zacarias", id: "zc"}, {nome: "Malaquias", id: "ml"},
            {nome: "Mateus", id: "mt"}, {nome: "Marcos", id: "mc"}, {nome: "Lucas", id: "lc"}, {nome: "João", id: "jo"}, {nome: "Atos", id: "at"},
            {nome: "Romanos", id: "rm"}, {nome: "1 Coríntios", id: "1co"}, {nome: "2 Coríntios", id: "2co"}, {nome: "Gálatas", id: "gl"}, {nome: "Efésios", id: "ef"},
            {nome: "Filipenses", id: "fp"}, {nome: "Colossenses", id: "cl"}, {nome: "1 Tessalonicenses", id: "1ts"}, {nome: "2 Tessalonicenses", id: "2ts"},
            {nome: "1 Timóteo", id: "1tm"}, {nome: "2 Timóteo", id: "2tm"}, {nome: "Tito", id: "tt"}, {nome: "Filemom", id: "fl"}, {nome: "Hebreus", id: "hb"},
            {nome: "Tiago", id: "tg"}, {nome: "1 Pedro", id: "1pe"}, {nome: "2 Pedro", id: "2pe"}, {nome: "1 João", id: "1jo"}, {nome: "2 João", id: "2jo"},
            {nome: "3 João", id: "3jo"}, {nome: "Judas", id: "jd"}, {nome: "Apocalipse", id: "ap"}
        ];

        let livroSelecionadoAtual = null;

        function montarGrid() {
            const grid = document.getElementById('gridLivros');
            grid.innerHTML = '';
            livrosBila.forEach(l => {
                const btn = document.createElement('div');
                btn.className = 'livro-btn';
                btn.textContent = l.nome;
                btn.onclick = () => selecionarLivro(l, btn);
                grid.appendChild(btn);
            });
        }

        async function selecionarLivro(livro, elementoBtn) {
            document.querySelectorAll('.livro-btn').forEach(b => b.classList.remove('ativo'));
            elementoBtn.classList.add('ativo');
            livroSelecionadoAtual = livro;

            const selectCap = document.getElementById('selectCapitulo');
            selectCap.innerHTML = '<option value="">Carregando capítulos...</option>';

            try {
                // Usando a API abibliadigital para buscar os dados do livro e ver quantos capítulos tem
                const response = await fetch(`https://www.abibliadigital.com.br/api/books/${livro.id}`);
                const data = await response.json();

                selectCap.innerHTML = '';
                for (let i = 1; i <= data.chapters; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `Capítulo ${i}`;
                    selectCap.appendChild(opt);
                }

                // Carrega o primeiro capítulo automaticamente ao escolher o livro
                carregarVersiculos();
            } catch (e) {
                console.error("Erro ao buscar capítulos", e);
                selectCap.innerHTML = '<option value="">Erro ao carregar capítulos</option>';
            }
        }

        async function carregarVersiculos() {
            if (!livroSelecionadoAtual) {
                alert('Selecione um livro na grade primeiro.');
                return;
            }

            const cap = document.getElementById('selectCapitulo').value;
            if (!cap) return;

            const loader = document.getElementById('loader');
            const leituraBox = document.getElementById('leituraBox');
            const tituloCapitulo = document.getElementById('tituloCapitulo');
            const textoCapitulo = document.getElementById('textoCapitulo');

            loader.style.display = 'block';
            leituraBox.style.display = 'none';

            try {
                // Buscando a versão Almeida (almeida) ou KJF do capítulo inteiro
                const url = `https://www.abibliadigital.com.br/api/verses/almeida/${livroSelecionadoAtual.id}/${cap}`;
                const response = await fetch(url);
                const data = await response.json();

                loader.style.display = 'none';

                if (data.error) {
                    alert('Erro ao carregar os versículos.');
                    return;
                }

                tituloCapitulo.textContent = `${data.book.name} - Capítulo ${data.chapter}`;
                textoCapitulo.innerHTML = '';

                data.verses.forEach(v => {
                    const p = document.createElement('div');
                    p.className = 'versiculo-item';
                    p.innerHTML = `<span>${v.number}</span> ${v.text}`;
                    textoCapitulo.appendChild(p);
                });

                leituraBox.style.display = 'block';
            } catch (error) {
                loader.style.display = 'none';
                console.error("Erro:", error);
                alert('Falha ao buscar o texto bíblico.');
            }
        }

        // Inicializa a grade ao abrir a página
        montarGrid();
    </script>
</body>
</html>
